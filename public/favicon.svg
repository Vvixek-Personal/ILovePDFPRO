<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Apple Vibrant Crimson-Rose -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e63" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Gloss Highlight Top-Edge Rim -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Paper Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Corner Fold Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4c0519" flood-opacity="0.45" />
    </filter>

    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Apple Squircle Base -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="108"
    fill="url(#bgGrad)"
    filter="url(#dropShadow)"
  />

  <!-- Specular Rim Inner Stroke -->
  <rect
    x="17"
    y="17"
    width="478"
    height="478"
    rx="107"
    fill="none"
    stroke="url(#glossGrad)"
    stroke-width="3"
  />

  <!-- Document Graphic with Sheet Shadow -->
  <g filter="url(#sheetShadow)">
    <!-- Main Sheet Path with Folded Top Right Corner -->
    <path
      d="M 160 120 
         L 290 120 
         L 352 182 
         L 352 392 
         A 24 24 0 0 1 328 416 
         L 184 416 
         A 24 24 0 0 1 160 392 
         Z"
      fill="url(#sheetGrad)"
    />

    <!-- Folded Corner Flap -->
    <path
      d="M 290 120 
         L 290 166 
         A 16 16 0 0 0 306 182 
         L 352 182 
         Z"
      fill="url(#foldGrad)"
    />
  </g>

  <!-- Document Line Text Guides -->
  <rect x="200" y="218" width="112" height="14" rx="7" fill="#e2e8f0" />
  <rect x="200" y="248" width="80" height="14" rx="7" fill="#e2e8f0" />

  <!-- Vibrant Heart Badge Emblem -->
  <g transform="translate(256, 332)">
    <!-- Glow behind Heart -->
    <circle cx="0" cy="0" r="44" fill="#ffe4e6" />
    <path
      d="M 0, -10 
         C -16, -34 -52, -22 -44, 10 
         C -36, 42 0, 64 0, 64 
         C 0, 64 36, 42 44, 10 
         C 52, -22 16, -34 0, -10 Z"
      fill="#e11d48"
      transform="scale(0.58) translate(0, -18)"
    />
  </g>

  <!-- Tiny Sparkle Star in Upper Left -->
  <path
    d="M 112 136 Q 112 152 96 152 Q 112 152 112 168 Q 112 152 128 152 Q 112 152 112 136 Z"
    fill="#ffffff"
    opacity="0.85"
  />
</svg>
